name: Khmer ink-mass visual calibration

on:
  push:
    branches:
      - test/khmer-visual-backend-parity
  pull_request:

jobs:
  ink-mass-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install visual reference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-noto-core libfribidi0 libharfbuzz0b poppler-utils
      - name: Build Khmer visual baselines
        run: |
          python conformance/visual_backend_parity.py --fixture fixtures/khmer.txt --out target/ink-mass/short --min-similarity 0.995
          python conformance/visual_backend_parity.py --fixture fixtures/khmer-paragraph-natural.txt --out target/ink-mass/paragraph --min-similarity 0.995
      - name: Gate clean localized Khmer ink mass
        run: |
          for dir in short paragraph; do
            python conformance/visual_ink_mass_window_gate.py \
              --dir target/ink-mass/$dir \
              --window-fraction 0.05 --stride-fraction 0.025 \
              --min-similarity 0.90 \
              --output target/ink-mass/$dir/ink-mass-clean-results.json
          done
      - name: Calibrate tone-preserving-mask defect
        run: |
          for dir in short paragraph; do
            python conformance/visual_metric_tone_sensitivity.py \
              --dir target/ink-mass/$dir \
              --width-fraction 0.10 --x-position 0.40 --tone 160
            python conformance/visual_ink_mass_window_gate.py \
              --dir target/ink-mass/$dir \
              --candidate-prefix sensitivity-tone-w0p100-xp0p40-v160/system-harfbuzz-tone-w0p100-xp0p40-v160 \
              --window-fraction 0.05 --stride-fraction 0.025 \
              --expect-below 0.90 \
              --output target/ink-mass/$dir/ink-mass-calibration.json
          done
      - name: Upload ink-mass evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khmer-ink-mass-visual
          path: target/ink-mass/**
