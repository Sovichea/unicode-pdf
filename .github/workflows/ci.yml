name: CI

on:
  push:
  pull_request:

jobs:
  rust-pure:
    name: Rust (HarfRust + unicode-bidi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build default pure-Rust backend
        run: cargo build --workspace
      - name: Clippy default pure-Rust backend
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test default pure-Rust backend
        run: cargo test --workspace

  rust-system:
    name: Rust (system HarfBuzz + FriBidi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - name: Install native reference backends
        run: |
          sudo apt-get update
          sudo apt-get install -y libfribidi0 libharfbuzz0b
      - name: Build native reference backend
        run: |
          cargo build --workspace \
            --no-default-features \
            --features system-harfbuzz,system-fribidi
      - name: Test native reference backend
        env:
          UNICODE_PDF_REQUIRE_SYSTEM_HARFBUZZ: '1'
          UNICODE_PDF_REQUIRE_SYSTEM_FRIBIDI: '1'
        run: |
          cargo test --workspace \
            --no-default-features \
            --features system-harfbuzz,system-fribidi
      - name: Clippy native reference backend
        run: |
          cargo clippy --workspace --all-targets \
            --no-default-features \
            --features system-harfbuzz,system-fribidi \
            -- -D warnings

  conformance:
    runs-on: ubuntu-latest
    env:
      UNICODE_PDF_CONFORMANCE_BACKEND: system
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system PDF and text dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fontconfig \
            fonts-dejavu-core \
            fonts-noto-core \
            ghostscript \
            libfribidi0 \
            libharfbuzz0b \
            poppler-utils
      - name: Install pinned reader bindings
        run: |
          python -m pip install PyMuPDF==1.26.7 pypdfium2==5.8.0 playwright==1.55.0
          npm install --prefix target/conformance-node --no-save pdfjs-dist@6.2.108
      - name: Test conformance harness
        run: python -m unittest discover -s conformance -p 'test_*.py'
      - name: Cross-reader Unicode conformance
        run: |
          scripts/run-conformance.sh \
            --require poppler,mupdf,pdfium,pdfjs \
            --pdfjs-dist target/conformance-node/node_modules/pdfjs-dist \
            --check-baseline
      - name: Paragraph semantic fidelity
        run: |
          python conformance/check_paragraph_semantics.py \
            --out target/conformance \
            --json target/conformance/paragraph-semantics.json
      - name: Khmer visual backend parity
        run: |
          python conformance/visual_backend_parity.py \
            --fixture fixtures/khmer.txt \
            --out target/visual-backend-parity/short \
            --min-similarity 0.995
          python conformance/visual_backend_parity.py \
            --fixture fixtures/khmer-paragraph-natural.txt \
            --out target/visual-backend-parity/paragraph \
            --min-similarity 0.995
          for dir in short paragraph; do
            python conformance/visual_region_gate.py \
              --dir target/visual-backend-parity/$dir \
              --regions 10 \
              --rows 4 \
              --min-region-ink-iou 0.90
            python conformance/visual_line_gate.py \
              --dir target/visual-backend-parity/$dir \
              --segments 10 \
              --min-line-segment-ink-iou 0.90
          done
      - name: Calibrate Khmer visual metric sensitivity
        run: |
          for dir in short paragraph; do
            python conformance/visual_metric_sensitivity.py \
              --dir target/visual-backend-parity/$dir \
              --shift-x 2 \
              --shift-y 0 \
              --whole-page-pass 0.995 \
              --ink-reject 0.90
            python conformance/visual_metric_sensitivity.py \
              --dir target/visual-backend-parity/$dir \
              --shift-x 0 \
              --shift-y 2 \
              --whole-page-pass 0.995 \
              --ink-reject 0.90
            python conformance/visual_metric_clipping_sensitivity.py \
              --dir target/visual-backend-parity/$dir \
              --clip-top-rows 15 \
              --whole-page-pass 0.995 \
              --ink-reject 0.90
            python conformance/visual_metric_scale_sensitivity.py \
              --dir target/visual-backend-parity/$dir \
              --scale 1.005 \
              --whole-page-pass 0.995 \
              --ink-reject 0.90
            python conformance/visual_metric_local_sensitivity.py \
              --dir target/visual-backend-parity/$dir \
              --fraction 0.10 \
              --shift-x 2 \
              --whole-page-pass 0.995 \
              --page-ink-pass 0.90 \
              --local-ink-reject 0.90
            python conformance/visual_region_gate.py \
              --dir target/visual-backend-parity/$dir \
              --candidate-prefix sensitivity-local-0p100-x+2/system-harfbuzz-local-0p100-x+2 \
              --regions 10 \
              --rows 4 \
              --expect-below 0.90
            python conformance/visual_metric_cell_sensitivity.py \
              --dir target/visual-backend-parity/$dir \
              --width-fraction 0.10 \
              --height-fraction 0.25 \
              --x-position 0.0 \
              --y-position 0.80 \
              --shift-x 2 \
              --strip-pass 0.90 \
              --cell-reject 0.90
            python conformance/visual_region_gate.py \
              --dir target/visual-backend-parity/$dir \
              --candidate-prefix sensitivity-cell-w0p100-h0p250-xp0p00-yp0p80-x+2/system-harfbuzz-cell-w0p100-h0p250-xp0p00-yp0p80-x+2 \
              --regions 10 \
              --rows 4 \
              --expect-below 0.90
            python conformance/visual_metric_line_sensitivity.py \
              --dir target/visual-backend-parity/$dir \
              --width-fraction 0.10 \
              --shift-x 2
            python conformance/visual_line_gate.py \
              --dir target/visual-backend-parity/$dir \
              --candidate-prefix sensitivity-line-w0p100-x+2/system-harfbuzz-line-w0p100-x+2 \
              --segments 10 \
              --expect-below 0.90
          done
      - name: Selection geometry conformance
        run: |
          python conformance/run_geometry.py \
            --pdfjs-dist target/conformance-node/node_modules/pdfjs-dist \
            --out target/geometry-conformance \
            --check-baseline
      - name: Install Playwright browsers for PDF.js DOM selection
        run: python -m playwright install --with-deps chromium firefox
      - name: Typsastra PDF.js selection conformance (Chromium)
        run: |
          python conformance/run_pdfjs_typsastra.py \
            --pdfjs-dist target/conformance-node/node_modules/pdfjs-dist \
            --out target/pdfjs-typsastra-chromium \
            --browser chromium \
            --check-baseline
      - name: Typsastra PDF.js selection conformance (Firefox)
        continue-on-error: true
        run: |
          python conformance/run_pdfjs_typsastra.py \
            --pdfjs-dist target/conformance-node/node_modules/pdfjs-dist \
            --out target/pdfjs-typsastra-firefox \
            --browser firefox \
            --check-baseline
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unicode-pdf-conformance
          path: |
            target/conformance/RESULTS.md
            target/conformance/results.json
            target/conformance/paragraph-semantics.json
            target/conformance/*.pdf
            target/conformance/extracted/**
            target/visual-backend-parity/**
            target/geometry-conformance/RESULTS.md
            target/geometry-conformance/results.json
            target/geometry-conformance/*.geometry.json
            target/geometry-conformance/*.pdfjs.json
            target/pdfjs-typsastra-chromium/RESULTS.md
            target/pdfjs-typsastra-chromium/results.json
            target/pdfjs-typsastra-firefox/RESULTS.md
            target/pdfjs-typsastra-firefox/results.json
