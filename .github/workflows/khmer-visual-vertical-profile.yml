name: Khmer vertical-profile visual calibration

on:
  push:
    branches:
      - test/khmer-visual-backend-parity
  pull_request:

jobs:
  vertical-profile-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install visual reference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fontconfig \
            fonts-noto-core \
            libfribidi0 \
            libharfbuzz0b \
            poppler-utils
      - name: Build Khmer visual baselines
        run: |
          python conformance/visual_backend_parity.py \
            --fixture fixtures/khmer.txt \
            --out target/vertical-profile/short \
            --min-similarity 0.995
          python conformance/visual_backend_parity.py \
            --fixture fixtures/khmer-paragraph-natural.txt \
            --out target/vertical-profile/paragraph \
            --min-similarity 0.995
      - name: Gate Khmer line vertical profiles
        run: |
          for dir in short paragraph; do
            python conformance/visual_vertical_profile_gate.py \
              --dir target/vertical-profile/$dir \
              --min-line-profile-similarity 0.90
            python conformance/visual_vertical_window_profile_gate.py \
              --dir target/vertical-profile/$dir \
              --window-fraction 0.05 \
              --stride-fraction 0.025 \
              --min-window-profile-similarity 0.90
            python conformance/visual_vertical_zone_window_gate.py \
              --dir target/vertical-profile/$dir \
              --zone upper \
              --zone-fraction 0.25 \
              --window-fraction 0.05 \
              --stride-fraction 0.025 \
              --min-zone-profile-similarity 0.90 \
              --output target/vertical-profile/$dir/vertical-zone-window-upper-results.json
            python conformance/visual_vertical_zone_window_gate.py \
              --dir target/vertical-profile/$dir \
              --zone lower \
              --zone-fraction 0.25 \
              --window-fraction 0.05 \
              --stride-fraction 0.025 \
              --min-zone-profile-similarity 0.90 \
              --output target/vertical-profile/$dir/vertical-zone-window-lower-results.json
          done
      - name: Calibrate localized upper-zone vertical mark displacement
        run: |
          for dir in short paragraph; do
            python conformance/visual_metric_vertical_sensitivity.py \
              --dir target/vertical-profile/$dir \
              --zone upper \
              --zone-fraction 0.25 \
              --shift-y 2
            python conformance/visual_vertical_window_profile_gate.py \
              --dir target/vertical-profile/$dir \
              --candidate-prefix sensitivity-vertical-z0p250-y+2/system-harfbuzz-vertical-z0p250-y+2 \
              --window-fraction 0.05 \
              --stride-fraction 0.025 \
              --expect-below 0.90 \
              --output target/vertical-profile/$dir/vertical-window-profile-displacement-calibration.json
            python conformance/visual_vertical_zone_window_gate.py \
              --dir target/vertical-profile/$dir \
              --candidate-prefix sensitivity-vertical-z0p250-y+2/system-harfbuzz-vertical-z0p250-y+2 \
              --zone upper \
              --zone-fraction 0.25 \
              --window-fraction 0.05 \
              --stride-fraction 0.025 \
              --expect-below 0.90 \
              --output target/vertical-profile/$dir/vertical-zone-window-upper-displacement-calibration.json
          done
      - name: Calibrate localized lower-zone vertical mark displacement
        run: |
          for dir in short paragraph; do
            python conformance/visual_metric_vertical_sensitivity.py \
              --dir target/vertical-profile/$dir \
              --zone lower \
              --zone-fraction 0.25 \
              --shift-y -2
            python conformance/visual_vertical_zone_window_gate.py \
              --dir target/vertical-profile/$dir \
              --candidate-prefix sensitivity-vertical-lower-z0p250-y-2/system-harfbuzz-vertical-lower-z0p250-y-2 \
              --zone lower \
              --zone-fraction 0.25 \
              --window-fraction 0.05 \
              --stride-fraction 0.025 \
              --expect-below 0.90 \
              --output target/vertical-profile/$dir/vertical-zone-window-lower-displacement-calibration.json
          done
      - name: Upload vertical-profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khmer-vertical-profile-visual
          path: target/vertical-profile/**
