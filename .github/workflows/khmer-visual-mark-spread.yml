name: Khmer mark-spread visual calibration

on:
  push:
    branches:
      - test/khmer-visual-backend-parity
  pull_request:

jobs:
  mark-spread-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install visual reference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fontconfig \
            fonts-noto-core \
            libfribidi0 \
            libharfbuzz0b \
            poppler-utils
      - name: Build Khmer visual baselines
        run: |
          python conformance/visual_backend_parity.py \
            --fixture fixtures/khmer.txt \
            --out target/mark-spread/short \
            --min-similarity 0.995
          python conformance/visual_backend_parity.py \
            --fixture fixtures/khmer-paragraph-natural.txt \
            --out target/mark-spread/paragraph \
            --min-similarity 0.995
      - name: Gate clean Khmer mark shape spread
        run: |
          for dir in short paragraph; do
            for zone in upper lower; do
              python conformance/visual_mark_spread_window_gate.py \
                --dir target/mark-spread/$dir \
                --zone $zone \
                --zone-fraction 0.25 \
                --window-fraction 0.05 \
                --stride-fraction 0.025 \
                --max-rms-spread-change 0.50 \
                --output target/mark-spread/$dir/mark-spread-window-$zone-results.json
            done
          done
      - name: Calibrate symmetric Khmer mark deformation
        run: |
          for dir in short paragraph; do
            for zone in upper lower; do
              python conformance/visual_metric_mark_spread_sensitivity.py \
                --dir target/mark-spread/$dir \
                --zone $zone \
                --zone-fraction 0.25 \
                --scale-x 1.20
              if [ "$zone" = "upper" ]; then
                candidate="sensitivity-mark-spread-z0p250-sx1p200/system-harfbuzz-mark-spread-z0p250-sx1p200"
              else
                candidate="sensitivity-mark-spread-lower-z0p250-sx1p200/system-harfbuzz-mark-spread-lower-z0p250-sx1p200"
              fi
              python conformance/visual_mark_spread_window_gate.py \
                --dir target/mark-spread/$dir \
                --candidate-prefix "$candidate" \
                --zone $zone \
                --zone-fraction 0.25 \
                --window-fraction 0.05 \
                --stride-fraction 0.025 \
                --expect-above 0.75 \
                --output target/mark-spread/$dir/mark-spread-$zone-deformation-calibration.json
            done
          done
      - name: Upload mark-spread evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khmer-mark-spread-visual
          path: target/mark-spread/**
