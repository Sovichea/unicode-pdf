name: Khmer edge-pixel visual calibration

on:
  push:
    branches:
      - test/khmer-visual-backend-parity
  pull_request:

jobs:
  edge-pixel-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install visual reference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-noto-core libfribidi0 libharfbuzz0b poppler-utils
      - name: Build Khmer visual baselines
        run: |
          python conformance/visual_backend_parity.py --fixture fixtures/khmer.txt --out target/edge-pixel/short --min-similarity 0.995
          python conformance/visual_backend_parity.py --fixture fixtures/khmer-paragraph-natural.txt --out target/edge-pixel/paragraph --min-similarity 0.995
      - name: Gate clean localized Khmer edge pixels
        run: |
          for dir in short paragraph; do
            python conformance/visual_edge_pixel_window_gate.py \
              --dir target/edge-pixel/$dir \
              --window-fraction 0.05 --stride-fraction 0.025 \
              --edge-threshold 16 --min-edge-pixels 16 \
              --min-similarity 0.90 \
              --output target/edge-pixel/$dir/edge-pixel-clean-results.json
          done
      - name: Calibrate localized Khmer edge blur
        run: |
          for dir in short paragraph; do
            python conformance/visual_metric_blur_sensitivity.py \
              --dir target/edge-pixel/$dir \
              --width-fraction 0.10 --x-position 0.40 --passes 3
            python conformance/visual_edge_pixel_window_gate.py \
              --dir target/edge-pixel/$dir \
              --candidate-prefix sensitivity-blur-w0p100-xp0p40-p3/system-harfbuzz-blur-w0p100-xp0p40-p3 \
              --window-fraction 0.05 --stride-fraction 0.025 \
              --edge-threshold 16 --min-edge-pixels 16 \
              --expect-below 0.90 \
              --output target/edge-pixel/$dir/edge-pixel-calibration.json
          done
      - name: Upload edge-pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khmer-edge-pixel-visual
          path: target/edge-pixel/**
