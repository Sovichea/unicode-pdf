name: Khmer mark-centroid visual calibration

on:
  push:
    branches:
      - test/khmer-visual-backend-parity
  pull_request:

jobs:
  mark-centroid-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install visual reference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-noto-core libfribidi0 libharfbuzz0b poppler-utils
      - name: Build Khmer visual baselines
        run: |
          python conformance/visual_backend_parity.py --fixture fixtures/khmer.txt --out target/mark-centroid/short --min-similarity 0.995
          python conformance/visual_backend_parity.py --fixture fixtures/khmer-paragraph-natural.txt --out target/mark-centroid/paragraph --min-similarity 0.995
      - name: Gate clean localized Khmer mark centroids
        run: |
          for dir in short paragraph; do
            for zone in upper lower; do
              python conformance/visual_mark_centroid_window_gate.py \
                --dir target/mark-centroid/$dir \
                --zone $zone --zone-fraction 0.25 \
                --window-fraction 0.05 --stride-fraction 0.025 \
                --ink-threshold 250 --min-zone-ink-pixels 8 \
                --max-centroid-displacement 0.50 \
                --output target/mark-centroid/$dir/mark-centroid-$zone-clean-results.json
            done
          done
      - name: Calibrate upper Khmer mark displacement
        run: |
          for dir in short paragraph; do
            python conformance/visual_metric_vertical_sensitivity.py \
              --dir target/mark-centroid/$dir \
              --zone upper --zone-fraction 0.25 --shift-y 2
            python conformance/visual_mark_centroid_window_gate.py \
              --dir target/mark-centroid/$dir \
              --candidate-prefix 'sensitivity-vertical-z0p250-y+2/system-harfbuzz-vertical-z0p250-y+2' \
              --zone upper --zone-fraction 0.25 \
              --window-fraction 0.05 --stride-fraction 0.025 \
              --ink-threshold 250 --min-zone-ink-pixels 8 \
              --expect-above 0.50 \
              --output target/mark-centroid/$dir/mark-centroid-upper-calibration.json
          done
      - name: Calibrate lower Khmer mark displacement
        run: |
          for dir in short paragraph; do
            python conformance/visual_metric_vertical_sensitivity.py \
              --dir target/mark-centroid/$dir \
              --zone lower --zone-fraction 0.25 --shift-y -2
            python conformance/visual_mark_centroid_window_gate.py \
              --dir target/mark-centroid/$dir \
              --candidate-prefix sensitivity-vertical-lower-z0p250-y-2/system-harfbuzz-vertical-lower-z0p250-y-2 \
              --zone lower --zone-fraction 0.25 \
              --window-fraction 0.05 --stride-fraction 0.025 \
              --ink-threshold 250 --min-zone-ink-pixels 8 \
              --expect-above 0.50 \
              --output target/mark-centroid/$dir/mark-centroid-lower-calibration.json
          done
      - name: Upload mark-centroid evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khmer-mark-centroid-visual
          path: target/mark-centroid/**
